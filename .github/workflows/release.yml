name: Release

# Every pushed tag vX.Y.Z becomes a GitHub release with prebuilt binaries,
# which start.sh / setup.sh (and the .ps1 versions) download when Go isn't
# installed. Run it by hand to (re)build a release for an existing tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish (e.g. v1.0.0)
        required: true
      latest:
        description: Mark it as the latest release
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Build
        run: |
          # build.sh lives at repo root in v1.0+; older tags kept it under gui/.
          if [ -f build.sh ]; then
            bash build.sh "$PWD/dist" "$TAG"
          else
            bash gui/build.sh "$PWD/dist" "$TAG"
          fi
          ls -l dist

      - name: Notes
        run: |
          # Release body = per-release description + shared install guide + changelog.
          # The description is this tag's section in CHANGELOG.md — everything
          # between its "## <tag>" heading and the next "## v..." heading. Living
          # in a file, its Markdown headings survive (no --cleanup=verbatim needed).
          # Falls back to the tag/commit message body if CHANGELOG.md has no section.
          NOTES=notes.md
          DESC="$(awk -v t="$TAG" '
            $0 ~ "^## " t "([^0-9.]|$)" { grab=1; next }
            grab && /^## v[0-9]/ { exit }
            grab { print }
          ' CHANGELOG.md | sed '/./,$!d')"
          if [ -z "$DESC" ]; then
            DESC="$(git for-each-ref "refs/tags/$TAG" --format='%(contents:body)')"
            [ -z "$DESC" ] && DESC="$(git log -1 --format=%b "$TAG^{commit}")"
            # Drop git trailers (Co-authored-by / Signed-off-by / ...).
            DESC="$(printf '%s\n' "$DESC" | grep -viE '^[A-Za-z-]+-by:')"
          fi
          [ -n "$DESC" ] && printf '%s\n\n' "$DESC" > "$NOTES" || : > "$NOTES"
          sed "s|__TAG__|$TAG|g" .github/release-install.md >> "$NOTES"
          PREV="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)"
          [ -n "$PREV" ] && printf '\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
            "$GITHUB_REPOSITORY" "$PREV" "$TAG" >> "$NOTES"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ github.event_name == 'push' || inputs.latest }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "CPE Box $TAG" --notes-file notes.md
          else
            gh release create "$TAG" --title "CPE Box $TAG" --notes-file notes.md --verify-tag --latest="$LATEST"
          fi
          gh release upload "$TAG" dist/* --clobber
